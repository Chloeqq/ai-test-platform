openapi: 3.1.0
info:
  title: AI Orchestrator API
  version: 0.1.0
  description: >
    Minimal orchestration API for generating YAML test cases via the test-design-agent
    and optionally dispatching the web-playwright-python runner.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /assets/scaffold/templates:
    get:
      summary: List available scaffold templates
      operationId: getScaffoldTemplates
      responses:
        "200":
          description: Available scaffold templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScaffoldTemplateListResponse"
        "500":
          description: Internal template discovery failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/scaffold/templates/{template}:
    get:
      summary: Get a scaffold template definition
      operationId: getScaffoldTemplate
      parameters:
        - in: path
          name: template
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scaffold template details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScaffoldTemplateResponse"
        "422":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal template discovery failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/latest:
    get:
      summary: Get the latest execution report
      operationId: getLatestExecutionReport
      responses:
        "200":
          description: Latest execution report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionReportResponse"
        "422":
          description: Report lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal report lookup failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /reports/{case_id}:
    get:
      summary: Get an execution report by case id
      operationId: getExecutionReportByCaseId
      parameters:
        - in: path
          name: case_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Execution report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionReportResponse"
        "422":
          description: Report lookup failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal report lookup failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /runners/catalog:
    get:
      summary: List supported runner profiles
      operationId: getRunnerCatalog
      responses:
        "200":
          description: Runner catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerCatalogResponse"
        "500":
          description: Internal runner catalog failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orchestrate:
    post:
      summary: Generate a test case and optionally execute it
      operationId: postOrchestrate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchestrateRequest"
      responses:
        "201":
          description: Test case generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestrationResult"
        "400":
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Route not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Runner execution failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal orchestration failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /requirements/parse:
    post:
      summary: Parse requirement into structured test intents
      operationId: postParseRequirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseRequirementRequest"
      responses:
        "201":
          description: Requirement parsed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseRequirementResponse"
        "400":
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Route not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal requirement parsing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healing/preview:
    post:
      summary: Preview self-healing advice without modifying YAML or page objects
      operationId: postHealingPreview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfHealingPreviewRequest"
      responses:
        "200":
          description: Self-healing advice preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelfHealingPreviewResponse"
        "400":
          description: Invalid JSON payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Route not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal self-healing preview failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/page-objects:
    post:
      summary: Create a page object asset
      operationId: postPageObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePageObjectRequest"
      responses:
        "201":
          description: Page object created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageObjectAssetResponse"
        "422":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal asset management failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/page-objects/{page}/elements:
    post:
      summary: Add or update an element inside a page object
      operationId: postPageObjectElement
      parameters:
        - in: path
          name: page
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPageElementRequest"
      responses:
        "201":
          description: Page object element added or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageObjectAssetResponse"
        "422":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal asset management failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/test-cases/sync:
    post:
      summary: Rewrite an existing YAML test case with standard steps inferred from its page object
      operationId: postSyncTestCase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncTestCaseRequest"
      responses:
        "200":
          description: Test case synchronized successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCaseAssetResponse"
        "422":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal asset management failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/scaffold:
    post:
      summary: Create a page object and smoke test case scaffold together
      operationId: postAssetScaffold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScaffoldAssetsRequest"
      responses:
        "201":
          description: Asset scaffold created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScaffoldAssetsResponse"
        "422":
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal asset management failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    OrchestrateRequest:
      type: object
      additionalProperties: false
      required:
        - requirement
        - page
      properties:
        requirement:
          type: string
          minLength: 1
          description: Natural language requirement to convert into a YAML test case
        page:
          type: string
          minLength: 1
          description: Target page object name, for example `product`
        execute:
          type: boolean
          default: false
          description: Whether to execute the generated case immediately
        mode:
          type: string
          enum:
            - generate_only
            - generate_and_run
          description: >
            Optional explicit execution mode. When provided, it takes precedence over `execute`.
        source:
          type: string
          enum:
            - manual
            - ai
            - regression
          default: manual
          description: Optional request source label used for reporting only
        runner:
          type: string
          enum:
            - playwright
            - api
            - mobile
          default: playwright
          description: Runner profile used for generation and execution orchestration
        input_sources:
          type: array
          items:
            $ref: "#/components/schemas/RequirementInputSourceV1"
        openapi_spec:
          type: object
          additionalProperties: true
        prd_text:
          type: string
        user_story:
          type: string
        git_diff:
          type: string
        defect_ticket:
          type: string
        runtime_logs:
          type: string
    ParseRequirementRequest:
      type: object
      additionalProperties: false
      required:
        - requirement
        - page
      properties:
        requirement:
          type: string
          description: Requirement text (can be empty when multi-source fields are provided)
        page:
          type: string
          description: Target page slug (can be empty when parser resolves from inputs)
        source:
          type: string
          enum:
            - manual
            - ai
            - regression
          default: manual
        input_sources:
          type: array
          items:
            $ref: "#/components/schemas/RequirementInputSourceV1"
        openapi_spec:
          type: object
          additionalProperties: true
        prd_text:
          type: string
        user_story:
          type: string
        git_diff:
          type: string
        defect_ticket:
          type: string
        runtime_logs:
          type: string
    ParseRequirementResponse:
      type: object
      additionalProperties: false
      required:
        - requirement_spec
      properties:
        requirement_spec:
          $ref: "#/components/schemas/RequirementSpecV1"
    RequirementInputSourceV1:
      type: object
      additionalProperties: false
      required:
        - source_type
      properties:
        source_type:
          type: string
        source_id:
          type: string
        source_name:
          type: string
        source_ref:
          type: string
        content:
          type: string
        metadata:
          type: object
          additionalProperties: true
    RequirementInputSource:
      $ref: "#/components/schemas/RequirementInputSourceV1"
    RunnerProfile:
      type: object
      additionalProperties: false
      required:
        - runner
        - display_name
        - channel
        - framework
        - language
        - execution_supported
      properties:
        runner:
          type: string
        display_name:
          type: string
        channel:
          type: string
        framework:
          type: string
        language:
          type: string
        execution_supported:
          type: boolean
        generation_supported:
          type: boolean
        environment_pool:
          type: string
        artifact_mode:
          type: string
        root_path:
          type: string
    RunnerCatalogResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - default_runner
      properties:
        default_runner:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/RunnerProfile"
    RequirementTestIntentV1:
      type: object
      additionalProperties: false
      required:
        - intent_id
        - intent_type
        - title
      properties:
        intent_id:
          type: string
        intent_type:
          type: string
        title:
          type: string
        summary:
          type: string
        priority:
          type: string
        dependencies:
          type: array
          items:
            type: string
        steps_hint:
          type: array
          items:
            type: string
        source_ids:
          type: array
          items:
            type: string
    RequirementAmbiguityV1:
      type: object
      additionalProperties: false
      required:
        - text
        - severity
      properties:
        text:
          type: string
        severity:
          type: string
        impact:
          type: string
        suggestion:
          type: string
        source_ids:
          type: array
          items:
            type: string
    RequirementBusinessRuleV1:
      type: object
      additionalProperties: false
      required:
        - rule_id
        - rule_text
      properties:
        rule_id:
          type: string
        rule_type:
          type: string
        rule_text:
          type: string
        severity:
          type: string
        source_ids:
          type: array
          items:
            type: string
    RequirementCoverageEntryV1:
      type: object
      additionalProperties: false
      required:
        - source_type
        - source_id
      properties:
        source_type:
          type: string
        source_id:
          type: string
        intent_ids:
          type: array
          items:
            type: string
        coverage_status:
          type: string
    RequirementQualityGateBlockerV1:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        category:
          type: string
        severity:
          type: string
          enum:
            - low
            - medium
            - high
            - critical
        alert_code:
          type: string
        metric_key:
          type: string
        value:
          oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
            - type: "null"
        threshold:
          oneOf:
            - type: string
            - type: number
            - type: integer
            - type: boolean
            - type: "null"
    RequirementQualityGateV1:
      type: object
      additionalProperties: false
      required:
        - version
        - stage
        - gate_enabled
        - decision
        - metrics
        - blockers
      properties:
        version:
          type: string
          const: RequirementQualityGateV1
        stage:
          type: string
          enum:
            - parse
            - orchestrate
        gate_enabled:
          type: boolean
        decision:
          type: string
          enum:
            - allow
            - block
        metrics:
          type: object
          additionalProperties: true
        blockers:
          type: array
          items:
            $ref: "#/components/schemas/RequirementQualityGateBlockerV1"
    RequirementSpecV1:
      type: object
      additionalProperties: false
      required:
        - version
        - source
        - requirement
        - page
        - parse_confidence
        - test_intents
        - ambiguities
        - business_rules
        - coverage_matrix
        - quality_gate
      properties:
        version:
          type: string
          const: RequirementSpecV1
        source:
          type: string
        requirement:
          type: string
        page:
          type: string
        parse_confidence:
          type: number
        priority:
          type: string
        input_sources:
          type: array
          items:
            $ref: "#/components/schemas/RequirementInputSourceV1"
        test_intents:
          type: array
          items:
            $ref: "#/components/schemas/RequirementTestIntentV1"
        ambiguities:
          type: array
          items:
            $ref: "#/components/schemas/RequirementAmbiguityV1"
        business_rules:
          type: array
          items:
            $ref: "#/components/schemas/RequirementBusinessRuleV1"
        coverage_matrix:
          type: array
          items:
            $ref: "#/components/schemas/RequirementCoverageEntryV1"
        quality_gate:
          $ref: "#/components/schemas/RequirementQualityGateV1"
    OrchestrationResult:
      type: object
      additionalProperties: false
      required:
        - case
        - test_points
        - execution_record
        - case_path
        - execution_requested
        - runner_exit_code
        - runner_stdout
        - runner_stderr
        - report
        - report_json_path
        - report_markdown_path
        - report_summary_path
      properties:
        case:
          type: object
          description: Generated YAML test case as a JSON object
        test_points:
          $ref: "#/components/schemas/TestPointPlanV1"
        execution_record:
          $ref: "#/components/schemas/ExecutionRecordV1"
        case_path:
          type: string
          description: Absolute path to the saved YAML file
        execution_requested:
          type: boolean
        runner_exit_code:
          type:
            - integer
            - "null"
        runner_stdout:
          type: string
        runner_stderr:
          type: string
        report:
          $ref: "#/components/schemas/ExecutionReport"
        report_json_path:
          type: string
          description: Absolute path to the saved JSON report
        report_markdown_path:
          type: string
          description: Absolute path to the saved Markdown report
        report_summary_path:
          type: string
          description: Absolute path to the aggregated report_summary.txt file when execution was requested
    TestPointV1:
      type: object
      additionalProperties: false
      required:
        - key
        - point_type
        - description
        - action
      properties:
        key:
          type: string
        point_type:
          type: string
        description:
          type: string
        action:
          type: string
        target:
          type: string
        value:
          type: string
        priority:
          type: string
        dependencies:
          type: array
          items:
            type: string
        source_ids:
          type: array
          items:
            type: string
    TestPoint:
      $ref: "#/components/schemas/TestPointV1"
    TestPointPlanV1:
      type: object
      additionalProperties: false
      required:
        - version
        - schema_version
        - project
        - case_id
        - page
        - requirement
        - generated_at
        - points
      properties:
        version:
          type: string
          const: TestPointPlanV1
        schema_version:
          type: string
          const: test-point-plan.v1
        project:
          type: string
        case_id:
          type: string
        page:
          type: string
        page_url:
          type: string
        requirement:
          type: array
          items:
            type: string
        source_type:
          type: string
        source_name:
          type: string
        source_ref:
          type: string
        priority:
          type: string
        generated_at:
          type: string
          format: date-time
        points:
          type: array
          items:
            $ref: "#/components/schemas/TestPointV1"
        coverage:
          type: object
        metadata:
          type: object
    TestPointPlan:
      $ref: "#/components/schemas/TestPointPlanV1"
    ExecutionReport:
      type: object
      additionalProperties: false
      required:
        - status
        - summary
        - case_id
        - case_title
        - page
        - case_path
        - execution_requested
        - source
        - request_context
        - started_at
        - finished_at
        - runner_exit_code
        - metrics
        - pytest_results
        - failure_reason
        - self_healing_enabled
        - self_healing_attempted
        - failure_analysis
        - self_healing_advice
        - self_healing_suggestion_preview
        - self_healing_execution_preview
        - execution_record
        - execution_record_meta
        - evidence
        - runner_stdout_excerpt
        - runner_stderr_excerpt
      properties:
        status:
          type: string
          enum:
            - generated
            - passed
            - failed
        summary:
          type: string
        case_id:
          type: string
        case_title:
          type: string
        page:
          type: string
        case_path:
          type: string
        execution_requested:
          type: boolean
        source:
          type: string
          enum:
            - manual
            - ai
            - regression
        request_context:
          $ref: "#/components/schemas/ExecutionRequestContext"
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        runner_exit_code:
          type:
            - integer
            - "null"
        metrics:
          $ref: "#/components/schemas/ExecutionReportMetrics"
        pytest_results:
          $ref: "#/components/schemas/PytestResults"
        failure_reason:
          type: string
        self_healing_enabled:
          type: boolean
        self_healing_attempted:
          type: boolean
        failure_analysis:
          $ref: "#/components/schemas/FailureAnalysis"
        self_healing_advice:
          $ref: "#/components/schemas/SelfHealingAdvice"
        self_healing_suggestion_preview:
          $ref: "#/components/schemas/SelfHealingSuggestionPreview"
        self_healing_execution_preview:
          $ref: "#/components/schemas/SelfHealingExecutionPreview"
        execution_record:
          $ref: "#/components/schemas/ExecutionRecordV1"
        execution_record_meta:
          $ref: "#/components/schemas/ExecutionRecordResolutionMetaV1"
        evidence:
          $ref: "#/components/schemas/EvidenceManifestV1"
        runner_stdout_excerpt:
          type: string
        runner_stderr_excerpt:
          type: string
    ExecutionReportMetrics:
      type: object
      additionalProperties: false
      required:
        - passed
        - failed
        - skipped
        - errors
      properties:
        passed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        errors:
          type: integer
          minimum: 0
    ExecutionRequestContext:
      type: object
      additionalProperties: false
      required:
        - page
        - mode
        - source
        - execution_requested
      properties:
        page:
          type: string
        mode:
          type: string
          enum:
            - generate_only
            - generate_and_run
        source:
          type: string
          enum:
            - manual
            - ai
            - regression
        execution_requested:
          type: boolean
    EvidenceManifestV1:
      type: object
      additionalProperties: false
      required:
        - version
        - schema_version
        - generated_at
        - artifact_root
        - metadata
        - screenshots
        - html_pages
        - meta_files
        - analysis_files
        - suggestion_files
        - execution_record_files
        - self_healing_result_files
        - videos
        - other_files
        - total_files
      properties:
        version:
          type: string
          const: EvidenceManifestV1
        schema_version:
          type: string
          const: evidence-manifest.v1
        generated_at:
          type: string
          format: date-time
        artifact_root:
          type: string
        metadata:
          type: object
        screenshots:
          type: array
          items:
            type: string
        html_pages:
          type: array
          items:
            type: string
        meta_files:
          type: array
          items:
            type: string
        analysis_files:
          type: array
          items:
            type: string
        suggestion_files:
          type: array
          items:
            type: string
        execution_record_files:
          type: array
          items:
            type: string
