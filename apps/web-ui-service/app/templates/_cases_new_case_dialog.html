<dialog id="new-case-dialog" class="case-dialog">
  <form id="new-case-form" method="dialog">
    <header>
      <h3>手动新建用例草稿</h3>
      <button type="button" class="close-btn" id="btn-close-dialog">×</button>
    </header>

    <ol class="wizard-steps">
      <li>1. 填写基本信息</li>
      <li>2. 补充脚本与标签</li>
      <li>3. 提交为 Draft</li>
    </ol>

    <p class="inline-tip">如果要走 AI 生成主流程，请前往 <a href="/ai-generation">AI生成</a>；用例中心不再提供第二个 AI 生成入口。</p>

    <div class="form-grid">
      <label>项目
        <select id="new-project-code" name="project_code">
          <option value="atp" selected>atp</option>
        </select>
      </label>
      <label>用例名称
        <input id="new-name" name="name" placeholder="例如：商品页筛选条件组合验证">
      </label>
      <label>产品线
        <input id="new-product-line" name="product_line" value="电商平台" required>
      </label>
      <label>模块
        <input id="new-module" name="module" value="商品中心" required>
      </label>
      <label>优先级
        <select id="new-priority" name="priority">
          <option value="P1">P1</option>
          <option value="P2" selected>P2</option>
          <option value="P3">P3</option>
        </select>
      </label>
      <label>测试类型
        <select id="new-test-type" name="test_type">
          <option value="ui" selected>UI</option>
          <option value="api">API</option>
          <option value="mobile">Mobile</option>
        </select>
      </label>
      <label>标签（逗号分隔）
        <input id="new-tags" name="tags" placeholder="smoke,search,web">
      </label>
      <label>标记（逗号分隔）
        <input id="new-markers" name="markers" placeholder="smoke,regression,p0">
      </label>
      <label>创建人
        <input id="new-creator" name="creator" value="admin">
      </label>
      <label>Pytest 路径
        <input id="new-pytest-path" name="pytest_path" placeholder="tests/ui/oms/test_return_apply.py">
      </label>
      <label>状态
        <select id="new-status" name="status">
          <option value="active" selected>active</option>
          <option value="inactive">inactive</option>
          <option value="deprecated">deprecated</option>
        </select>
      </label>
    </div>

    <label id="manual-script-wrap">脚本代码
      <textarea id="new-script" name="script_code" rows="8" placeholder="def test_xxx(page): ..."></textarea>
    </label>

    <footer>
      <button type="button" class="btn" id="btn-cancel-dialog">取消</button>
      <button type="submit" class="btn btn-primary">创建 Draft</button>
    </footer>
  </form>
</dialog>
