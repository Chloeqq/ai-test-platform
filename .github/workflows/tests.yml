name: Tests

on:
  pull_request:
  push:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite to run
        required: true
        default: static-baseline
        type: choice
        options:
          - static-baseline
          - e2e-smoke
          - e2e-generated
          - all

jobs:
  unit-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'static-baseline' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install root dev dependencies
        run: make install-dev

      - name: Architecture guard (file/function size, repo enforcement, layer imports)
        run: make check-architecture

      - name: Run unit tests (两批: facade/precheck + 其余)
        run: make test-unit

  static-baseline:
    if: github.event_name != 'workflow_dispatch' || inputs.suite == 'static-baseline' || inputs.suite == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web-ui-service/frontend/package-lock.json

      - name: Build TypeScript + React frontend
        working-directory: apps/web-ui-service/frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install root dev dependencies
        run: make install-dev

      - name: Run all contract tests
        run: make test-contracts

      - name: Run static baseline (ruff + mypy + pytest)
        run: make static-baseline

      - name: Install Playwright browser for orchestrate smoke
        run: .venv/bin/playwright install --with-deps chromium

      - name: Run orchestrate execute=true smoke chain
        run: make test-orchestrate-e2e-smoke

  e2e-smoke:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'e2e-smoke' || inputs.suite == 'all')
    runs-on: self-hosted
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      HOME: ${{ github.workspace }}/.home
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.runner-tool-cache
      RUNNER_TEMP: ${{ github.workspace }}/.runner-temp
      AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/.runner-tool-cache
    steps:
      - name: Prepare writable local directories
        run: |
          mkdir -p "$HOME" "$PIP_CACHE_DIR" "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install root dev dependencies
        run: make install-dev

      - name: Install Playwright browser
        run: .venv/bin/playwright install chromium

      - name: Verify E2E secrets
        run: |
          test -n "$BASE_URL"
          test -n "$TEST_USERNAME"
          test -n "$TEST_PASSWORD"

      - name: Run smoke E2E tests
        run: make test-e2e-smoke

  e2e-generated:
    if: github.event_name == 'workflow_dispatch' && (inputs.suite == 'e2e-generated' || inputs.suite == 'all')
    runs-on: self-hosted
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      HOME: ${{ github.workspace }}/.home
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/.runner-tool-cache
      RUNNER_TEMP: ${{ github.workspace }}/.runner-temp
      AGENT_TOOLSDIRECTORY: ${{ github.workspace }}/.runner-tool-cache
    steps:
      - name: Prepare writable local directories
        run: |
          mkdir -p "$HOME" "$PIP_CACHE_DIR" "$PLAYWRIGHT_BROWSERS_PATH" "$RUNNER_TOOL_CACHE" "$RUNNER_TEMP"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install root dev dependencies
        run: make install-dev

      - name: Install Playwright browser
        run: .venv/bin/playwright install chromium

      - name: Verify E2E secrets
        run: |
          test -n "$BASE_URL"
          test -n "$TEST_USERNAME"
          test -n "$TEST_PASSWORD"

      - name: Run generated E2E tests
        run: make test-e2e-generated
