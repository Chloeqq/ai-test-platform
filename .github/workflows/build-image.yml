name: Build Image

on:
  push:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image repository
        id: image_repo
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "repo=ghcr.io/${owner}/ai-test-platform-web" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_repo.outputs.repo }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=ai-test-platform-web
            org.opencontainers.image.description=AI Test Platform web-ui-service runtime image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Docker image
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Print image tags
        run: |
          echo "Published image tags:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Publish build summary
        env:
          IMAGE_REPO: ${{ steps.image_repo.outputs.repo }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build_and_push.outputs.digest }}
        run: |
          {
            echo "## Image Build Summary"
            echo ""
            echo "- Repository: ${IMAGE_REPO}"
            echo "- Digest: ${IMAGE_DIGEST}"
            echo "- Tags:"
            while IFS= read -r line; do
              [[ -z "${line}" ]] && continue
              echo "  - ${line}"
            done <<< "${IMAGE_TAGS}"
          } >> "${GITHUB_STEP_SUMMARY}"
