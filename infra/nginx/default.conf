server {
    listen 80;
    server_name _;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # 需求文档上传:放开请求体上限到 20MB(与 app 层 REQUIREMENT_UPLOAD_MAX_BYTES 默认一致)。
    # nginx 默认 client_max_body_size 为 1MB,不放开则大文件在到达 web 前被 nginx 直接 413,
    # 且错误来自 nginx 前端、app 无从排查。仅对该 API 子树放开,其余端点保持默认。
    location /api/workbench/requirement-documents/ {
        client_max_body_size 20m;
        proxy_pass http://web:8013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:8013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
