    expected_result: 登录页面加载完成，显示账号输入框、密码输入框、登录按钮
  - action: input
    target: element:username_input
    locator_type: data-testid
    locator_value: login-username-input
    target_name: 用户名输入框
    value: '{{login_username}}'
    expected_result: 用户名输入框内容显示为 admin
  - action: input
    target: element:password_input
    locator_type: data-testid
    locator_value: login-password-input
    target_name: 密码输入框
    value: '{{login_password}}'
    expected_result: 密码输入框内容以掩码形式显示
  - action: click
    target: element:login_button
    locator_type: data-testid
    locator_value: login-submit-btn
    target_name: 登录按钮
    expected_result: 已点击登录按钮
  - action: assert_visible
    target: element:home_menu
    locator_type: data-testid
    locator_value: home-page
    target_name: 首页关键元素
    expected_result: 只进行一次登录操作，成功登录后跳转到首页
