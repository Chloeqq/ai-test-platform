id: atp-web-login-auth-fn-ai-0103
module: login
owner: qa-team
priority: P1
requirement:
- '登录功能：

  - 正确账号密码可登录成功

  - 未登录不能访问首页

  - 用户名或密码为空需要提示

  - 账号密码错误需要提示

  - 用户名长度超限需要提示

  测试意图：账号锁定，登录失败提示 场景维度：normal

  测试类型：functional

  前置条件：用户处于未登录状态，账号已被锁定，登录页面已打开

  操作步骤：

  1. 在用户名输入框输入被锁定的用户名 test001

  2. 在密码输入框输入正确密码 123456

  3. 点击登录按钮

  预期结果：弹出提示框，提示账号已被锁定

  涉及元素：用户名输入框、密码输入框、登录按钮'
- '[P0] 首次登录成功'
- '[P0] 已登录态访问首页保持可用'
- '[P0] 未登录访问首页被拦截'
- '[P1] 用户名和密码都为空登录'
- '[P1] 用户名为空登录'
status: automated
