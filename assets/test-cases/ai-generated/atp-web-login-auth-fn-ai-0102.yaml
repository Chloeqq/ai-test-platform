id: atp-web-login-auth-fn-ai-0102
module: login
owner: qa-team
priority: P2
requirement:
- '登录功能：

  - 正确账号密码可登录成功

  - 未登录不能访问首页

  - 用户名或密码为空需要提示

  - 账号密码错误需要提示

  - 用户名长度超限需要提示

  测试意图：登录超时提示

  测试类型：interaction_exception

  前置条件：用户处于未登录状态，模拟弱网环境

  操作步骤：

  1. 在用户名输入框输入 test001

  2. 在密码输入框输入 123456

  3. 点击登录按钮

  涉及元素：用户名输入框、密码输入框、登录按钮'
- '[P0] 首次登录成功'
- '[P0] 已登录态访问首页保持可用'
- '[P0] 未登录访问首页被拦截'
- '[P1] 用户名空登录提示'
- '[P1] 密码空登录提示'
