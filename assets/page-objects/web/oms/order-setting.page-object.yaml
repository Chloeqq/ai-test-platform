page: oms/order-setting

description: OMS 订单设置页面 - 配置订单相关参数

elements:
  # 导航菜单
  order_setting_menu:
    locator_type: role
    role: menuitem
    locator_value: 订单设置

  # 订单超时设置
  order_timeout_section:
    locator_type: text
    locator_value: 订单超时设置

  order_timeout_input:
    locator_type: css
    locator_value: input[name="orderTimeout"]
    description: 订单超时时间输入框（分钟）

  order_timeout_unit:
    locator_type: text
    locator_value: 分钟

  # 自动取消设置
  auto_cancel_section:
    locator_type: text
    locator_value: 自动取消设置

  auto_cancel_switch:
    locator_type: css
    locator_value: .el-switch[name="autoCancel"]
    description: 自动取消开关

  auto_cancel_timeout:
    locator_type: css
    locator_value: input[name="autoCancelTimeout"]
    description: 自动取消超时时间

  # 订单确认设置
  order_confirm_section:
    locator_type: text
    locator_value: 订单确认设置

  order_confirm_switch:
    locator_type: css
    locator_value: .el-switch[name="orderConfirm"]
    description: 订单确认开关

  # 保存按钮
  save_button:
    locator_type: role
    role: button
    locator_value: 保存

  # 重置按钮
  reset_button:
    locator_type: role
    role: button
    locator_value: 重置

  # 成功提示
  success_message:
    locator_type: css
    locator_value: .el-message--success
    description: 保存成功提示

  # 错误提示
  error_message:
    locator_type: css
    locator_value: .el-message--error
    description: 保存失败提示
