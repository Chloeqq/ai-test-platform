page: login

elements:
  username_input:
    locator_type: placeholder
    locator_value: 请输入用户名
    element_name: 用户名输入框
    aliases:
      - 账号输入框
      - 用户名

  password_input:
    locator_type: placeholder
    locator_value: 请输入密码
    element_name: 密码输入框
    aliases:
      - 密码

  password_toggle:
    locator_type: css
    locator_value: .el-input__suffix, .password-visibility-toggle, [data-testid='password-toggle']
    element_name: 密码显隐开关
    business_type: password_toggle
    aliases:
      - 眼睛图标
      - 密码显隐
      - 密码可见性切换
      - 密码明文切换

  remember_password_checkbox:
    locator_type: role
    role: checkbox
    locator_value: 记住密码
    element_name: 记住密码复选框
    business_type: checkbox
    aliases:
      - 记住密码

  login_button:
    locator_type: role
    role: button
    locator_value: 登录
    element_name: 登录按钮
    aliases:
      - 登录

  home_menu:
    locator_type: role
    role: menuitem
    locator_value: 首页
    element_name: 首页菜单
    aliases:
      - 首页
      - 工作台首页

  logout_option:
    locator_type: text
    locator_value: 退出
    element_name: 退出登录按钮
    business_type: button
    aliases:
      - 退出登录
      - 退出登录按钮
