input {
  file {
    path => "/var/log/ai-test-platform/*.log"
    start_position => "beginning"
    sincedb_path => "/tmp/logstash-sincedb"
    mode => "tail"
  }
}

filter {
}

output {
  stdout {
    codec => rubydebug
  }
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "ai-test-platform-%{+YYYY.MM.dd}"
  }
}
