services:
  web:
    image: ai-quality-platform-web-ui
    build:
      context: .
      dockerfile: Dockerfile
    command: /bin/bash /app/scripts/docker/start-web-with-desktop.sh
    restart: unless-stopped
    environment:
      APP_ENV: docker
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DATABASE_AUTO_CREATE_TABLES: "false"
      WORKBENCH_STATE_BACKEND: database
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      REDIS_PREFIX: aitest
      ORCHESTRATOR_URL: http://orchestrator:8000
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:?ORCHESTRATOR_API_KEY must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "120"
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      ADMIN_ROLE: ${ADMIN_ROLE:?ADMIN_ROLE must be set}
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      LOG_FILE_PATH: /var/log/ai-quality-platform/web-ui-service.log
      BASE_URL: ${BASE_URL:?BASE_URL must be set}
      RUNNER_LOOPBACK_HOST: ${RUNNER_LOOPBACK_HOST:-}
      RUNNER_URL_REWRITE_MAP: ${RUNNER_URL_REWRITE_MAP:-}
      TEST_USERNAME: ${TEST_USERNAME:?TEST_USERNAME must be set}
      TEST_PASSWORD: ${TEST_PASSWORD:?TEST_PASSWORD must be set}
      RECORDER_DESKTOP_ENABLED: ${RECORDER_DESKTOP_ENABLED:-true}
      RECORDER_DISPLAY: ${RECORDER_DISPLAY:-:99}
      RECORDER_SCREEN: ${RECORDER_SCREEN:-1280x900x24}
      RECORDER_NOVNC_PORT: "6080"
      RECORDER_VNC_PORT: "5900"
      RECORDER_VNC_PASSWORD: ${RECORDER_VNC_PASSWORD:-}
      PAGE_OBJECT_SOURCE_ROOTS: ${PAGE_OBJECT_SOURCE_ROOTS:-/workspace/mall-admin-web}
      PAGE_OBJECT_SOURCE_ROOTS_BY_PROJECT: '${PAGE_OBJECT_SOURCE_ROOTS_BY_PROJECT:-{"mall":"/workspace/mall-admin-web"}}'
      PAGE_OBJECT_SOURCE_ROOTS_MALL: ${PAGE_OBJECT_SOURCE_ROOTS_MALL:-/workspace/mall-admin-web}
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_REQUIREMENT_BUCKET: ${MINIO_REQUIREMENT_BUCKET:-ai-requirements}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_REGION: ${MINIO_REGION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_HOST_PORT:-8015}:8013"
      - "${RECORDER_NOVNC_HOST_PORT:-6080}:6080"
    volumes:
      - platform_logs:/var/log/ai-quality-platform
      - ./web-ui/state:/app/web-ui/state
      - ./assets/test-cases:/app/assets/test-cases
      - ${MALL_ADMIN_WEB_SOURCE_ROOT:-/Users/bettyhuang/IdeaProjects/mall-admin-web}:/workspace/mall-admin-web:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/health/ready', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - platform

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT:-8013}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - platform

  orchestrator:
    build:
      context: .
      dockerfile: apps/ai-orchestrator/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: docker
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      LOG_FILE_PATH: /var/log/ai-quality-platform/ai-orchestrator.log
      PYTHONPATH: /app:/app/apps/ai-orchestrator/src
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:?ORCHESTRATOR_API_KEY must be set}
      OPENAI_API_KEY: ${DOCKER_OPENAI_API_KEY:?DOCKER_OPENAI_API_KEY must be set}
      OPENAI_BASE_URL: ${DOCKER_OPENAI_BASE_URL:?DOCKER_OPENAI_BASE_URL must be set}
      OPENAI_MODEL: ${DOCKER_OPENAI_MODEL:?DOCKER_OPENAI_MODEL must be set}
      REQUIREMENT_PARSER_LLM_TIMEOUT_SECONDS: ${REQUIREMENT_PARSER_LLM_TIMEOUT_SECONDS:-150}
      REQUIREMENT_PARSER_LLM_MAX_RETRIES: ${REQUIREMENT_PARSER_LLM_MAX_RETRIES:-1}
      REQUIREMENT_PARSER_MAX_TOKENS: ${REQUIREMENT_PARSER_MAX_TOKENS:-8192}
    ports:
      - "${ORCHESTRATOR_HOST_PORT:-8000}:8000"
    volumes:
      - platform_logs:/var/log/ai-quality-platform
      - ./web-ui/state:/app/web-ui/state
      - ./assets/test-cases:/app/assets/test-cases
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - platform

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - platform

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - platform

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - platform

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: ${ELASTICSEARCH_SECURITY_ENABLED:-false}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
    networks:
      - platform

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.3
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - platform

  logstash:
    image: docker.elastic.co/logstash/logstash:7.17.3
    restart: unless-stopped
    volumes:
      - ./deploy/elk/logstash/pipeline:/usr/share/logstash/pipeline
      - platform_logs:/var/log/ai-quality-platform:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - platform

volumes:
  postgres_data:
  redis_data:
  minio_data:
  elasticsearch_data:
  platform_logs:

networks:
  platform:
    driver: bridge
