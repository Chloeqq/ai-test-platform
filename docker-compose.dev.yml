# Dev minimal — 仅本地开发需要的 4 个服务(postgres + redis + web + orchestrator)
# 用法: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 不含 ELK/nginx。ELK 日志分析用 docker-compose.yml 完整版。

services:
  web:
    volumes:
      - .:/app
    ports:
      - "8013:8013"

  orchestrator:
    volumes:
      - .:/app
    ports:
      - "8000:8000"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  # Dev mode 不需要 nginx/elasticsearch/kibana/logstash
  nginx:
    profiles: [prod]

  elasticsearch:
    profiles: [prod]

  kibana:
    profiles: [prod]

  logstash:
    profiles: [prod]
