[pytest]
testpaths =
    apps/ai-orchestrator/tests/integration
    apps/web-ui-service/tests/integration
    runners/web-playwright-python/tests/test_asset_contracts.py
    runners/web-playwright-python/tests/test_asset_toolkit.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    contract: Stable contract/schema/invariant checks that do not require a live app
    integration: Cross-module integration checks that do not require a live business environment
    e2e: End-to-end browser tests that require a runnable target system
    smoke: Curated smoke tests maintained by humans
    generated: AI-generated YAML-driven tests
norecursedirs =
    .git
    .idea
    .venv
    node_modules
    __pycache__
    runners/web-playwright-python/.venv
    runners/web-playwright-python/.pytest_cache
addopts = -ra
