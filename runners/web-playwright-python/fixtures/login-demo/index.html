<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录演示 · ATP E2E Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 2rem auto; padding: 0 1rem; }
    .err { color: #c00; font-size: 0.9rem; margin: 0.5rem 0; min-height: 1.2rem; }
    input { width: 100%; box-sizing: border-box; padding: 0.5rem; margin: 0.25rem 0 0.75rem; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    #homeView { display: none; }
    #homeView.visible { display: block; }
    #loginView { display: none; }
    #loginView.visible { display: block; }
    nav[role="menubar"] { border: 1px solid #ddd; padding: 0.5rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="loginView">
    <h1>登录</h1>
    <p style="font-size:12px;color:#666;">E2E 演示：用户名 <code>demo</code>，密码 <code>demo123</code></p>
    <label>用户名</label>
    <input id="username" type="text" autocomplete="username" placeholder="请输入用户名" />
    <label>密码</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
    <div id="msg" class="err" role="alert"></div>
    <button type="button" id="btnLogin">登录</button>
  </div>

  <div id="homeView">
    <h1>工作台</h1>
    <nav role="menubar">
      <span role="menuitem" id="navHome">首页</span>
    </nav>
    <p>已登录（演示页）</p>
  </div>

  <script>
    (function () {
      var AUTH_KEY = "login_demo_token";
      var MAX_USER_LEN = 50;
      var OK_USER = "demo";
      var OK_PASS = "demo123";

      function isAuthed() {
        return sessionStorage.getItem(AUTH_KEY) === "1";
      }

      function setAuthed(v) {
        if (v) sessionStorage.setItem(AUTH_KEY, "1");
        else sessionStorage.removeItem(AUTH_KEY);
      }

      function showLogin() {
        document.getElementById("loginView").classList.add("visible");
        document.getElementById("homeView").classList.remove("visible");
      }

      function showHome() {
        document.getElementById("loginView").classList.remove("visible");
        document.getElementById("homeView").classList.add("visible");
      }

      function setMsg(text) {
        document.getElementById("msg").textContent = text || "";
      }

      function route() {
        var h = (location.hash || "#/login").replace(/^#/, "");
        if (h !== "/login" && h !== "" && h !== "/" && h !== "/home") {
          location.hash = "#/login";
          h = "/login";
        }
        if (h === "/login" || h === "") {
          showLogin();
          return;
        }
        if (h === "/" || h === "/home") {
          if (!isAuthed()) {
            location.hash = "#/login";
            showLogin();
            return;
          }
          showHome();
        }
      }

      document.getElementById("btnLogin").addEventListener("click", function () {
        setMsg("");
        var u = (document.getElementById("username").value || "").trim();
        var p = document.getElementById("password").value || "";

        if (!u) {
          setMsg("请输入用户名");
          return;
        }
        if (!p) {
          setMsg("请输入密码");
          return;
        }
        if (u.length > MAX_USER_LEN) {
          setMsg("用户名长度超过限制");
          return;
        }
        if (u !== OK_USER || p !== OK_PASS) {
          setMsg("用户名或密码错误");
          return;
        }
        setAuthed(true);
        location.hash = "#/home";
        route();
      });

      window.addEventListener("hashchange", route);
      window.addEventListener("storage", function () { route(); });

      route();
    })();
  </script>
</body>
</html>
